[package]
name = "typedhp"
version = "0.1.0"
edition = "2024"
description = "Strips TypeScript-style types from PHP source, leaving plain PHP"

[dependencies]
ignore = "0.4.33"
itertools = "0.15.0"
mago-allocator = "1.51.2"
mago-database = "1.51.2"
mago-phpdoc-syntax = "1.51.2"
mago-span = "1.51.2"
mago-syntax = "1.51.2"
mago-syntax-core = "1.51.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
tempfile = "3.27.0"
